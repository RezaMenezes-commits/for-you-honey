<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FOR MY SAYANG SYAFIRA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,600&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff1ee;--bg2:#f7c6d0;--ink:#3b1530;--soft:#7a3b5c;--rose:#c2315f;--gold:#9a6212;--card:rgba(255,255,255,.65);--line:rgba(194,49,95,.28);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1c0f2e;--bg2:#4a1636;--ink:#fff1ee;--soft:#e9b7c8;--rose:#ff7fa5;--gold:#f2c879;--card:rgba(255,255,255,.07);--line:rgba(255,127,165,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#1c0f2e;--bg2:#4a1636;--ink:#fff1ee;--soft:#e9b7c8;--rose:#ff7fa5;--gold:#f2c879;--card:rgba(255,255,255,.07);--line:rgba(255,127,165,.3);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-size:1.25rem;line-height:1.65;min-height:100vh;overflow-x:hidden}
section{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4rem 1.5rem}
h1{font-size:clamp(3rem,13vw,7rem);font-weight:500;font-style:italic;line-height:1.05;letter-spacing:-.01em}
h2{font-size:clamp(1.9rem,6vw,3rem);font-weight:500;font-style:italic;margin-bottom:1.5rem}
.hand{font-family:Caveat,"Segoe Script",cursive;font-size:1.7rem;color:var(--rose)}
.sub{color:var(--soft);max-width:32ch;margin:1rem auto 2.5rem}
.count{display:flex;gap:1.2rem;justify-content:center;flex-wrap:wrap}
.count div{min-width:4.6rem;padding:.8rem .6rem;border:1px solid var(--line);border-radius:1.4rem;background:var(--card)}
.count b{display:block;font-size:2.2rem;font-weight:500;font-variant-numeric:tabular-nums;color:var(--gold)}
.count span{font-size:1rem;color:var(--soft)}
button{font:inherit;cursor:pointer;border:0;color:#fff;background:var(--rose);padding:.7rem 1.8rem;border-radius:99px;font-size:1.2rem;transition:transform .2s}
button:hover{transform:scale(1.05)}
button.ghost{background:transparent;color:var(--soft);border:1px solid var(--line)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.env{font-size:5rem;line-height:1;background:none;padding:0;animation:beat 1.6s ease-in-out infinite}
.letter{max-width:34rem;max-height:0;overflow:hidden;opacity:0;transition:max-height 1.4s ease,opacity .8s}
.letter.open{max-height:60rem;opacity:1;margin-top:2rem}
.letter p{margin:0 0 1.1rem;padding:0 .5rem;opacity:0;transform:translateY(8px);transition:opacity 1s,transform 1s;text-align:left}
.letter.open p{opacity:1;transform:none}
.letter .hand{text-align:right;margin-top:1.5rem}
.reason{min-height:7rem;max-width:30ch;font-size:1.7rem;font-style:italic;animation:fade .8s both}
.row{display:flex;gap:1rem;justify-content:center;align-items:center;flex-wrap:wrap;min-height:4.5rem;margin-top:1.5rem}
#no{position:relative}
#yes-msg{font-size:2rem;font-style:italic;color:var(--rose);margin-top:1.5rem;min-height:3rem}
.lagu{width:min(100%,34rem);aspect-ratio:16/9;height:auto;border:0;border-radius:1rem;margin-top:.5rem}
.h{position:fixed;pointer-events:none;z-index:5;color:var(--rose);animation:rise 4.5s ease-out forwards}
@keyframes rise{from{opacity:.9;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-70vh) translateX(var(--dx)) scale(1.3)}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section>
  <p class="hand" id="from"></p>
  <h1 id="name"></h1>
  <p class="sub">Setiap detik bersamamu adalah bagian favoritku dari hari-hari aku.</p>
  <div class="count" aria-label="Waktu kebersamaan kita">
    <div><b id="d">0</b><span>hari</span></div>
    <div><b id="h">0</b><span>jam</span></div>
    <div><b id="m">0</b><span>menit</span></div>
    <div><b id="s">0</b><span>detik</span></div>
  </div>
  <p class="sub" style="margin-top:1.5rem">…dan aku akan memilihmu di setiap detiknya.</p>
</section>

<section>
  <h2>Aku menulis sesuatu untukmu</h2>
  <button class="env" id="env" aria-label="Buka surat">💌</button>
  <div class="letter" id="letter" aria-live="polite"></div>
  <p class="hand" style="margin-top:2.5rem">Lagu untukmu</p>
  <iframe class="lagu" src="https://music.youtube.com/watch?v=ljLsfNN4fVE&si=iAvLy8mAScoYg73n&drli=1" title="Lagu Favorit kamu" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>
</section>

<section>
  <h2>Kenapa aku sayang kamu</h2>
  <p class="reason" id="reason">Ketuk tombolnya, nanti aku ceritakan.</p>
  <div class="row"><button id="why">Kenapa, sih?</button></div>
</section>

<section>
  <h2 id="q"></h2>
  <div class="row">
    <button id="yes">Mau</button>
    <button id="no" class="ghost">Nggak</button>
  </div>
  <p id="yes-msg" aria-live="polite"></p>
</section>

<script>
/* ✏️ Ganti bagian ini supaya jadi milikmu */
const C={
  name:"Sayangku",
  from:"Dari aku, dengan cinta",
  start:"2026-07-26", // tanggal jadian: TAHUN-BULAN-TANGGAL
  letter:[
    "Untuk kamu yang tersayang,",
    "Aku nggak tahu cara mengungkapkannya lewat kata-kata, jadi aku buatkan sudut kecil di internet ini untukmu.",
    "Kamu membuat hari-hari biasa aku menjadi sempurna. Tawamu adalah suara favoritku, dan genggaman tanganmu adalah tempat favoritku.",
    "Maaf kalo belakangan ini aku suka bikin kamu emosi.",
    "Kemarin aku udah bikin website juga untuk kamu, tapi kamu yang hilangin",
    "Tapi gakpapa jujur ini lebih effort daripada yang kemarin, dan ini juga lebih capek hahaha",
    "Terima kasih sudah sabar menghadapiku, percaya padaku, dan menyayangiku di hari-hari ketika aku sulit menyayangi diriku sendiri.",
    "Apa pun yang terjadi nanti, aku ingin menghadapinya bersamamu."
  ],
  sign:"Reza Milik Syafira, selalu",
  reasons:[
    "Senyummu membuat hatiku senang.",
    "Kamu membuatku ingin jadi orang yang lebih baik.",
    "Kamu adalah rumah, di mana pun aku berada.",
    "Kamu tertawa mendengar candaanku, bahkan yang garing.",
    "Kamu baik pada orang-orang yang bahkan tidak menyadarinya.",
    "Kamu selalu memasakan makanan untukku",
    "Dari kamu aku benar-benar tau apa itu cinta",
    "Karena bersamamu, aku bisa jadi diri sendiri."
  ],
  question:"Maukah kamu tetap di sisiku, selamanya?"
};

const $=id=>document.getElementById(id);
$("name").textContent=C.name;$("from").textContent=C.from;$("q").textContent=C.question;

/* penghitung waktu */
const t0=new Date(C.start+"T00:00:00");
function tick(){
  let ms=Math.max(0,Date.now()-t0.getTime());if(isNaN(ms))ms=0;
  const s=Math.floor(ms/1000);
  $("d").textContent=Math.floor(s/86400);
  $("h").textContent=Math.floor(s%86400/3600);
  $("m").textContent=Math.floor(s%3600/60);
  $("s").textContent=s%60;
}
tick();setInterval(tick,1000);

/* hati yang melayang */
const calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
function heart(x,y){
  if(calm)return;
  const e=document.createElement("span");e.className="h";e.textContent=Math.random()<.5?"♥":"❤";
  e.style.left=x+"px";e.style.top=y+"px";e.style.fontSize=(14+Math.random()*26)+"px";
  e.style.setProperty("--dx",(Math.random()*160-80)+"px");
  e.addEventListener("animationend",()=>e.remove());document.body.appendChild(e);
}
setInterval(()=>heart(Math.random()*innerWidth,innerHeight-10),900);
addEventListener("pointerdown",e=>heart(e.clientX,e.clientY));

/* surat */
const L=$("letter");
C.letter.forEach(x=>{const p=document.createElement("p");p.textContent=x;L.appendChild(p)});
const sg=document.createElement("p");sg.className="hand";sg.textContent=C.sign;L.appendChild(sg);
$("env").addEventListener("click",()=>{
  L.classList.add("open");
  [...L.children].forEach((p,i)=>p.style.transitionDelay=(.4+i*.9)+"s");
  for(let i=0;i<12;i++)setTimeout(()=>heart(innerWidth/2+(Math.random()*200-100),innerHeight/2),i*80);
});

/* alasan */
let ri=-1;
$("why").addEventListener("click",()=>{
  ri=(ri+1)%C.reasons.length;
  const r=$("reason");r.textContent=C.reasons[ri];
  r.style.animation="none";void r.offsetWidth;r.style.animation="";
  $("why").textContent="Alasan lainnya";
});

/* pertanyaan */
let tries=0;
$("no").addEventListener("click",()=>{
  tries++;
  if(tries>=5){$("no").textContent="Oke… aku mau";$("no").onclick=()=>$("yes").click();return}
  $("no").style.left=(Math.random()*120-60)+"px";
  $("no").style.top=(Math.random()*60-30)+"px";
  $("no").textContent=["Yakin?","Beneran?","Pikir lagi deh yg pernah kita jalanin…","Mau Dipukul?"][tries-1];
});
$("yes").addEventListener("click",()=>{
  $("yes-msg").textContent="Aku sudah tahu nenek. Aku sayang banget sama kamu my lovely SYAFIRA DESIANA CINDRA KAISA. 💗";
  for(let i=0;i<40;i++)setTimeout(()=>heart(Math.random()*innerWidth,innerHeight*.8),i*60);
});
</script>
</body>
</html>
